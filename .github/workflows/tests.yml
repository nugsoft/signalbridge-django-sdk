name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Spelled out rather than a full product: Django and Python support
      # windows only overlap for some pairs (Django 3.2 predates Python 3.11,
      # Django 5.0 requires 3.10+). These cover the floor and the ceiling of
      # what the package claims to support.
      matrix:
        include:
          - { python: "3.9", django: "3.2" }
          - { python: "3.9", django: "4.2" }
          - { python: "3.11", django: "4.2" }
          - { python: "3.12", django: "4.2" }
          - { python: "3.12", django: "5.0" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django }}.0" "requests>=2.25.0"

      - name: Show versions
        run: python -c "import django, requests; print('Django', django.get_version(), '| requests', requests.__version__)"

      - name: Run tests
        # Every test fakes the HTTP layer. If one ever reaches the real gateway
        # it sends a real SMS and bills the account, so there is deliberately no
        # token in this environment for it to use.
        run: django-admin test tests --settings=tests.settings --pythonpath=.

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      # The same checks the publish workflow runs, so a packaging regression
      # fails on the pull request rather than halfway through a release.
      - name: Check the distributions
        run: twine check --strict dist/*

      - name: Confirm the distribution contents
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          wheel = sorted(glob.glob('dist/*.whl'))[-1]
          names = zipfile.ZipFile(wheel).namelist()

          problems = []

          if 'signalbridge/AGENTS.md' not in names:
              problems.append('the wheel is missing signalbridge/AGENTS.md')

          if any(name.startswith(('tests/', 'examples/')) for name in names):
              problems.append('the wheel ships tests or examples')

          sdist = sorted(glob.glob('dist/*.tar.gz'))[-1]
          if not any(n.endswith('signalbridge/AGENTS.md') for n in tarfile.open(sdist).getnames()):
              problems.append('the sdist is missing signalbridge/AGENTS.md')

          for problem in problems:
              print(f'::error::{problem}')

          sys.exit(1 if problems else 0)
          PY
